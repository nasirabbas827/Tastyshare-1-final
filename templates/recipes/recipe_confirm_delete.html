{% extends "base.html" %}
{% block title %}Delete Recipe{% endblock %}

{% block content %}

<div class="container my-5">
<div class="row justify-content-center">
<div class="col-lg-6 col-md-8">
<div class="card shadow-lg p-4">
<div class="card-body">
<h2 class="card-title text-center mb-4">Delete Recipe</h2>
<div class="alert alert-danger text-center" role="alert">
<i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
<p class="lead mb-0">Are you sure you want to delete <strong>{{ recipe.title }}</strong>?</p>
<p>This action cannot be undone.</p>
</div>

                <form method="post" class="mt-4 text-center">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-block">
                        <button type="submit" class="btn btn-danger btn-lg me-2">
                            <i class="fas fa-trash-alt me-2"></i>Yes, delete
                        </button>
                        <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary btn-lg">
                            <i class="fas fa-times-circle me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
{% endblock %}
