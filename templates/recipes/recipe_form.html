{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">{{ title }}</h2>
        
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="form-row">
            <div class="form-group col-md-12">
              <label for="{{ form.title.id_for_label }}">Title</label>
              {{ form.title }}
            </div>
            <div class="form-group col-md-12">
              <label for="{{ form.description.id_for_label }}">Description</label>
              {{ form.description }}
            </div>
            <div class="form-group col-md-12">
              <label for="{{ form.ingredients.id_for_label }}">Ingredients</label>
              {{ form.ingredients }}
            </div>
            <div class="form-group col-md-12">
              <label for="{{ form.steps.id_for_label }}">Steps</label>
              {{ form.steps }}
            </div>
            <div class="form-group col-md-6">
              <label for="{{ form.category.id_for_label }}">Category</label>
              {{ form.category }}
            </div>
            <div class="form-group col-md-6">
              <label for="{{ form.cooking_time.id_for_label }}">Cooking Time (minutes)</label>
              {{ form.cooking_time }}
            </div>
            <div class="form-group col-md-12">
              <label for="{{ form.image.id_for_label }}">Image</label>
              {{ form.image }}
            </div>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'recipe_list' %}" class="btn btn-secondary">
              <i class="fas fa-times mr-2"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save mr-2"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
