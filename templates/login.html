{% extends "base.html" %}
{% block title %}Login | TastyShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h2 class="mb-4 text-center"><i class="fas fa-sign-in-alt"></i> Login</h2>
      
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success btn-block">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
      
      <p class="mt-3 text-center">
        Don’t have an account? 
        <a href="{% url 'register' %}"><i class="fas fa-user-plus"></i> Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
